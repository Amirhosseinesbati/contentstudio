name: ContentStudio checks

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.11.28
      - name: Install locked API dependencies
        working-directory: apps/api
        run: uv sync --locked --extra dev
      - name: Lint API
        working-directory: apps/api
        run: uv run ruff check src ../../tests/api
      - name: Test API
        working-directory: apps/api
        run: uv run pytest -q
      - name: Test migration on development SQLite
        working-directory: apps/api
        run: uv run alembic upgrade head

  workflows-and-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked API dependencies
        run: |
          python -m pip install uv==0.11.28
          uv sync --project apps/api --locked --extra dev
      - name: Workflow and simulator contracts
        run: uv run --project apps/api python -m unittest discover -s tests/workflows -v
      - name: Validate n8n exports
        run: python scripts/n8n/bootstrap.py --dry-run
      - name: Evaluate deterministic fixture cases
        run: python evals/run_fixture_eval.py
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - name: Install locked frontend dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Lint frontend
        working-directory: apps/web
        run: pnpm lint
      - name: Typecheck frontend
        working-directory: apps/web
        run: pnpm typecheck
      - name: Build frontend
        working-directory: apps/web
        run: pnpm build
